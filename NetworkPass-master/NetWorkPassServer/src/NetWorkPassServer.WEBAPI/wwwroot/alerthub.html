<!DOCTYPE html>
<html>
<body>

<h2>AlertHub Test</h2>

<div id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

<script>

function log(text)
{
    document.getElementById("log").innerHTML +=
        "<div>" + text + "</div>";
}

const connection = new signalR.HubConnectionBuilder()
    .withUrl("https://localhost:7036/hubs/alerts")
    .build();

connection.on("alert-created", data =>
{
    log("ALERT CREATED");
    console.log(data);
});

connection.on("alerts:acknowledged", data =>
{
    log("ALERT ACKNOWLEDGED");
    console.log(data);
});

connection.on("alerts:resolved", data =>
{
    log("ALERT RESOLVED");
    console.log(data);
});

connection.start()
    .then(() =>
    {
        log("CONNECTED");
    });

</script>

</body>
</html>
